<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007aff">
    <title>Moved — Beta Cattle Tracker</title>
    <!-- Fallback if the script below is blocked; long enough to let cleanup finish. -->
    <meta http-equiv="refresh" content="4; url=https://johnfreagan.github.io/JFR-Ranch-cattle-management-office-app-/field-app/">
    <style>
        html, body { margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f2f7;
            color: #1c1c1e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, .08);
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p  { font-size: 15px; line-height: 1.5; color: #3a3a3c; margin: 0 0 20px; }
        .btn {
            display: inline-block;
            background: #007aff;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 22px;
            border-radius: 12px;
        }
        .note { font-size: 13px; color: #8e8e93; margin: 20px 0 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>This app has moved</h1>
        <p>The Beta Cattle Tracker now lives at a new address. Taking you
           there&hellip;</p>
        <a class="btn" id="go"
           href="https://johnfreagan.github.io/JFR-Ranch-cattle-management-office-app-/field-app/">Open the tracker</a>
        <p class="note">If you added the old version to your home screen, delete
           that icon and add the new page instead.</p>
    </div>

<script>
(function () {
    var NEW_URL = 'https://johnfreagan.github.io/JFR-Ranch-cattle-management-office-app-/field-app/';

    // Tear down the old PWA before leaving, so an installed copy can never
    // serve itself from cache again. Each step is independent and best-effort —
    // a failure in one must not block the redirect.
    function cleanup() {
        var jobs = [];

        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            jobs.push(
                navigator.serviceWorker.getRegistrations()
                    .then(function (regs) {
                        return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    })
                    .catch(function () {})
            );
        }

        if (window.caches && caches.keys) {
            jobs.push(
                caches.keys()
                    .then(function (keys) {
                        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    })
                    .catch(function () {})
            );
        }

        return Promise.all(jobs);
    }

    function go() { window.location.replace(NEW_URL); }

    // NOTE: localStorage is per-origin, not per-path — both the old and new
    // URLs are on johnfreagan.github.io, so the betaCattle* keys are already
    // shared with the new location. Nothing to migrate, and nothing here
    // clears them.
    cleanup().then(go, go);

    // Belt and braces: never strand the user if a promise never settles.
    setTimeout(go, 2500);
}());
</script>
</body>
</html>
